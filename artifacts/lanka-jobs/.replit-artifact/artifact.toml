kind = "mobile"
previewPath = "/"
title = "LankaJobs"
description = "A native mobile job marketplace for Sri Lankan job seekers and employers, with searchable listings, saved jobs, and free job posting foundations."
version = "1.0.0"
id = "artifacts/lanka-jobs"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22707

[services.development]
run = "pnpm --filter @workspace/lanka-jobs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lanka-jobs", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lanka-jobs", "run", "serve" ]

[services.env]
PORT = "22707"
BASE_PATH = "/"
